plugins {
    id 'com.android.application'
}

// ===================== EDIT THESE TWO LINES ONLY =====================
// Your live website address WITHOUT https:// and WITHOUT a trailing slash.
def SITE_HOST = "YOUR-SITE.vercel.app"
// =====================================================================

android {
    namespace 'in.docufastindia.app'
    compileSdk 36

    defaultConfig {
        applicationId 'in.docufastindia.app'   // can never change after publishing
        minSdk 23
        targetSdk 36
        versionCode 1                          // +1 for every new upload to Play
        versionName '1.0'

        manifestPlaceholders = [
            hostName    : SITE_HOST,
            defaultUrl  : "https://" + SITE_HOST + "/home",
            launcherName: 'DocuFast',
        ]
        resValue "string", "asset_statements",
            '[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], ' +
            '\\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + SITE_HOST + '\\"}}]'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's official library for Trusted Web Activities (opens your site full-screen)
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
